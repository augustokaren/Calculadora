<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Moderna</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    
    <div class="fundo">
        <div class="calculadora">
            <div id="resultado" class="display"></div> 
            
            <div class="botoes-container">
                <button class="botao clear" data-value="C">C</button>
                <button class="botao operator" data-value="back">&larr;</button> <button class="botao operator" data-value="/">/</button>
                <button class="botao operator" data-value="*">X</button> <button class="botao number" data-value="7">7</button>
                <button class="botao number" data-value="8">8</button>
                <button class="botao number" data-value="9">9</button>
                <button class="botao operator" data-value="-">-</button>

                <button class="botao number" data-value="4">4</button>
                <button class="botao number" data-value="5">5</button>
                <button class="botao number" data-value="6">6</button>
                <button class="botao operator" data-value="+">+</button>

                <button class="botao number" data-value="1">1</button>
                <button class="botao number" data-value="2">2</button>
                <button class="botao number" data-value="3">3</button>
                <button class="botao equal" data-value="=">=</button>

                <button class="botao number zero" data-value="0">0</button>
                <button class="botao number" data-value=".">.</button>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
